<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IMPETEC - Control de Series y Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; padding: 20px; color: #1e293b; }
        .table-container { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; }
        th { background: #f8fafc; color: #64748b; font-size: 10px; text-transform: uppercase; padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .user-tag { background: #004691; color: white; padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 900; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; }
        
        /* Estilo para las Series */
        .serial-box { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; background: #fff; border: 1px solid #e2e8f0; padding: 3px 8px; border-radius: 6px; }
        .serial-text { font-family: monospace; font-weight: bold; font-size: 10px; color: #1e293b; }
        .status-available { color: #16a34a; font-size: 8px; font-weight: 900; text-transform: uppercase; background: #dcfce7; padding: 2px 5px; border-radius: 4px; }
        .status-sold { color: #ca8a04; font-size: 8px; font-weight: 900; text-transform: uppercase; background: #fef9c3; padding: 2px 5px; border-radius: 4px; }
        
        .cat-badge { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-bottom: 4px; display: inline-block; }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase italic">Inventario <span class="text-blue-600 italic">IMPETEC</span></h1>
                <div id="active-user-display" class="text-[10px] font-bold text-slate-400 mt-1 uppercase"></div>
            </div>
            
            <div class="relative w-full md:w-80">
                <i class="fas fa-search absolute left-4 top-3 text-slate-400"></i>
                <input type="text" id="busqueda" onkeyup="filtrarTabla()" placeholder="Buscar equipo o serie..." 
                class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:ring-2 ring-blue-500 outline-none text-sm">
            </div>

            <button onclick="openModal()" class="bg-blue-900 text-white px-6 py-2 rounded-xl font-bold uppercase text-[10px] shadow-lg">+ Nuevo Registro</button>
        </div>

        <div class="table-container shadow-sm overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr>
                        <th class="w-1/3">Producto / SKU</th>
                        <th>Series y Asignación</th>
                        <th class="text-center">Stock</th>
                        <th class="text-right">Precio</th>
                        <th class="text-right px-4 text-[8px]">Acción</th>
                    </tr>
                </thead>
                <tbody id="inventory-body" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <div id="modal-item" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-center justify-center backdrop-blur-sm overflow-y-auto p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-lg shadow-2xl my-auto">
            <h3 id="modal-title" class="font-black mb-6 uppercase text-blue-900 text-center">Gestión de Inventario</h3>
            <input type="hidden" id="f-id">
            
            <div class="space-y-4">
                <div class="flex gap-2 p-1 bg-slate-100 rounded-xl">
                    <button onclick="setType('EQUIPO')" id="btn-equipo" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition">Equipo</button>
                    <button onclick="setType('CONSUMIBLE')" id="btn-consumible" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400">Consumible</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="f-code" placeholder="SKU" class="p-3 rounded-xl bg-slate-50 border font-bold uppercase text-sm">
                    <input type="number" id="f-price" placeholder="PRECIO $" class="p-3 rounded-xl bg-slate-50 border font-bold text-blue-600 text-sm">
                </div>
                
                <input type="text" id="f-name" placeholder="NOMBRE DEL ARTÍCULO" class="w-full p-3 rounded-xl bg-slate-50 border font-bold text-sm">
                
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <label class="text-[10px] font-black text-blue-600 uppercase mb-2 block text-center">Cantidad en Stock</label>
                    <input type="number" id="f-stock" oninput="generarCamposSerie()" class="w-full p-2 rounded-xl bg-white border font-black text-center text-xl outline-none">
                </div>

                <div id="extra-fields" class="space-y-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Listado de Series y Clientes:</label>
                    <div id="contenedor-series" class="max-h-60 overflow-y-auto space-y-2 pr-2">
                        </div>
                </div>
            </div>

            <div class="flex gap-2 mt-6">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 p-3 rounded-xl font-bold uppercase text-[10px]">Cerrar</button>
                <button onclick="saveItem()" class="flex-1 bg-blue-900 text-white p-3 rounded-xl font-bold uppercase text-[10px]">Guardar Inventario</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://impetec-hub-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentType = 'EQUIPO';
        let currentUser = localStorage.getItem('imp_user') || 'Admin';
        document.getElementById('active-user-display').innerText = `Operador: ${currentUser}`;

        function setType(type) {
            currentType = type;
            document.getElementById('extra-fields').classList.toggle('hidden', type !== 'EQUIPO');
            document.getElementById('btn-equipo').className = type === 'EQUIPO' ? "flex-1 py-2 rounded-lg font-black text-[10px] bg-white text-blue-600 shadow-sm" : "flex-1 py-2 text-slate-400 font-black text-[10px]";
            document.getElementById('btn-consumible').className = type === 'CONSUMIBLE' ? "flex-1 py-2 rounded-lg font-black text-[10px] bg-white text-blue-600 shadow-sm" : "flex-1 py-2 text-slate-400 font-black text-[10px]";
            if(type === 'EQUIPO') generarCamposSerie();
        }

        function generarCamposSerie(datosPrevios = []) {
            if(currentType !== 'EQUIPO') return;
            const cant = parseInt(document.getElementById('f-stock').value) || 0;
            const contenedor = document.getElementById('contenedor-series');
            contenedor.innerHTML = '';
            
            for(let i = 0; i < Math.min(cant, 30); i++) {
                const sVal = datosPrevios[i]?.serie || '';
                const cVal = datosPrevios[i]?.cliente || '';
                contenedor.innerHTML += `
                    <div class="flex gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <input type="text" placeholder="SERIE" class="serie-val w-1/2 p-2 rounded border bg-white font-mono text-[10px] uppercase" value="${sVal}">
                        <input type="text" placeholder="CLIENTE (O DISPONIBLE)" class="cliente-val w-1/2 p-2 rounded border bg-white font-bold text-[10px] uppercase" value="${cVal}">
                    </div>`;
            }
        }

        function editItem(id) {
            db.ref('inventario/' + id).once('value', (snap) => {
                const d = snap.val();
                if(!d) return;
                document.getElementById('f-id').value = d.id;
                document.getElementById('f-code').value = d.code;
                document.getElementById('f-name').value = d.name;
                document.getElementById('f-stock').value = d.stock;
                document.getElementById('f-price').value = d.price;
                setType(d.tipo || 'EQUIPO');
                if(d.tipo === 'EQUIPO') generarCamposSerie(d.series_data || []);
                document.getElementById('modal-item').classList.remove('hidden');
            });
        }

        function saveItem() {
            const id = document.getElementById('f-id').value || 'SKU-' + Date.now();
            const seriesInputs = document.querySelectorAll('.serie-val');
            const clienteInputs = document.querySelectorAll('.cliente-val');
            
            let seriesData = [];
            seriesInputs.forEach((input, i) => {
                if(input.value) {
                    seriesData.push({
                        serie: input.value.toUpperCase(),
                        cliente: clienteInputs[i].value.toUpperCase() || 'DISPONIBLE'
                    });
                }
            });

            db.ref('inventario/' + id).update({
                id,
                tipo: currentType,
                code: document.getElementById('f-code').value.toUpperCase(),
                name: document.getElementById('f-name').value,
                stock: parseInt(document.getElementById('f-stock').value) || 0,
                price: parseFloat(document.getElementById('f-price').value) || 0,
                series_data: currentType === 'EQUIPO' ? seriesData : null,
                lastUser: currentUser,
                lastDate: new Date().toLocaleString()
            }).then(() => closeModal());
        }

        db.ref('inventario').on('value', snap => {
            const body = document.getElementById('inventory-body');
            body.innerHTML = '';
            snap.forEach(child => {
                const d = child.val();
                let seriesHtml = '';
                
                if(d.tipo === 'EQUIPO' && d.series_data) {
                    d.series_data.forEach(s => {
                        const isDisp = s.cliente === 'DISPONIBLE' || !s.cliente;
                        const statusClass = isDisp ? 'status-available' : 'status-sold';
                        seriesHtml += `
                            <div class="serial-box">
                                <span class="serial-text">${s.serie}</span>
                                <span class="${statusClass}">${isDisp ? 'Disponible' : s.cliente}</span>
                            </div>`;
                    });
                }

                body.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="p-4">
                            <span class="cat-badge ${d.tipo === 'EQUIPO' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-500'}">${d.tipo}</span>
                            <div class="font-black text-slate-700 uppercase text-xs">${d.name}</div>
                            <div class="text-[9px] text-blue-500 font-mono font-bold">${d.code}</div>
                        </td>
                        <td class="p-4">${seriesHtml || '<span class="text-slate-300 italic text-[10px]">No aplica</span>'}</td>
                        <td class="p-4 text-center font-black text-lg text-blue-900">${d.stock}</td>
                        <td class="p-4 text-right font-black text-slate-900">$${(d.price || 0).toLocaleString()}</td>
                        <td class="p-4 text-right">
                            <div class="flex justify-end gap-3">
                                <button onclick="editItem('${d.id}')" class="text-slate-300 hover:text-blue-600"><i class="fas fa-pen"></i></button>
                                <button onclick="if(confirm('¿Eliminar?')) db.ref('inventario/${d.id}').remove()" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });
        });

        function openModal() {
            document.getElementById('modal-item').classList.remove('hidden');
            document.getElementById('f-id').value = "";
            document.getElementById('f-stock').value = "";
            setType('EQUIPO');
        }
        function closeModal() { document.getElementById('modal-item').classList.add('hidden'); }
        function filtrarTabla() {
            let val = document.getElementById('busqueda').value.toUpperCase();
            let rows = document.getElementById('inventory-body').getElementsByTagName('tr');
            for (let r of rows) { r.style.display = r.innerText.toUpperCase().includes(val) ? '' : 'none'; }
        }
    </script>
</body>
</html>
