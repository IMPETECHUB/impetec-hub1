<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPETEC HUB PRO - AI Smart Pipeline</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #f1f5f9, #e2e8f0);
            height: 100vh;
            overflow: hidden; /* Evita que toda la pantalla haga scroll */
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }

        .deal-card {
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border: 1px solid #e2e8f0;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .deal-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
        }

        /* Scroll independiente por columna */
        .kanban-column {
            height: calc(100vh - 220px); /* Ajuste dinámico según cabecera */
            overflow-y: auto;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            padding: 10px;
        }

        .kanban-column::-webkit-scrollbar { width: 4px; }
        .kanban-column::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .drag-over {
            background: rgba(59, 130, 246, 0.08);
            outline: 2px dashed #3b82f6;
            outline-offset: 4px;
        }

        .custom-scroll::-webkit-scrollbar { height: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        #col-perdido { opacity: 0.6; grayscale: 1; transition: 0.3s; }
        #col-perdido:hover { opacity: 1; grayscale: 0; }

        .search-container {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 300px;
        }
    </style>
</head>
<body class="p-6">

    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white/60 p-4 rounded-3xl backdrop-blur-md border border-white/20 shadow-sm shrink-0">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-200">
                <i data-lucide="zap" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-800 text-slate-900 tracking-tighter">IMPETEC <span class="text-blue-600">SMART FLOW</span></h1>
                <div class="flex items-center gap-2">
                    <select id="m-sel" onchange="loadDeals()" class="text-[10px] font-bold uppercase text-slate-500 bg-transparent outline-none cursor-pointer hover:text-blue-600"></select>
                    <span id="year-display" class="text-[10px] font-bold text-slate-400">2026</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="search-container shadow-inner">
                <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                <input type="text" id="deal-search" onkeyup="renderBoard()" placeholder="Buscar cliente..." class="bg-transparent outline-none text-xs font-bold w-full uppercase">
            </div>

            <button onclick="openEditModal()" class="flex items-center gap-3 bg-slate-900 px-6 py-3 rounded-2xl text-sm font-bold text-white hover:bg-blue-600 transition-all shadow-xl">
                <i data-lucide="plus" class="w-5 h-5"></i> Nuevo Negocio
            </button>
        </div>
    </header>

    <div class="flex gap-8 overflow-x-auto pb-4 custom-scroll px-2 flex-1">
        
        <div class="flex-shrink-0 w-80">
            <div class="flex justify-between items-center mb-5 px-4">
                <h2 class="font-800 text-slate-500 uppercase text-[11px] tracking-widest flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Prospectos</h2>
                <span id="count-prospecto" class="text-[10px] font-black bg-white border px-3 py-1 rounded-full text-slate-400 shadow-sm">0</span>
            </div>
            <div id="prospecto" ondrop="drop(event, 'prospecto')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" class="kanban-column space-y-4"></div>
        </div>

        <div class="flex-shrink-0 w-80">
            <div class="flex justify-between items-center mb-5 px-4">
                <h2 class="font-800 text-blue-600 uppercase text-[11px] tracking-widest flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Cotizados</h2>
                <span id="val-cotizado" class="text-[10px] font-black text-slate-400">$0</span>
            </div>
            <div id="cotizado" ondrop="drop(event, 'cotizado')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" class="kanban-column space-y-4"></div>
        </div>

        <div class="flex-shrink-0 w-80">
            <div class="flex justify-between items-center mb-5 px-4">
                <h2 class="font-800 text-amber-600 uppercase text-[11px] tracking-widest flex items-center gap-2"><i data-lucide="hammer" class="w-4 h-4"></i> Obra</h2>
                <span id="val-obra" class="text-[10px] font-black text-slate-400">$0</span>
            </div>
            <div id="obra" ondrop="drop(event, 'obra')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" class="kanban-column space-y-4"></div>
        </div>

        <div class="flex-shrink-0 w-80">
            <div class="flex justify-between items-center mb-5 px-4">
                <h2 class="font-800 text-emerald-600 uppercase text-[11px] tracking-widest flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Ganado</h2>
                <span id="val-ganado" class="text-[10px] font-black text-slate-400">$0</span>
            </div>
            <div id="ganado" ondrop="drop(event, 'ganado')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" class="kanban-column space-y-4"></div>
        </div>

        <div id="col-perdido" class="flex-shrink-0 w-80 border-l border-slate-200 pl-4">
            <div class="flex justify-between items-center mb-5 px-4">
                <h2 class="font-800 text-red-500 uppercase text-[11px] tracking-widest flex items-center gap-2"><i data-lucide="x-circle" class="w-4 h-4"></i> Perdidos</h2>
                <span id="val-perdido" class="text-[10px] font-black text-slate-400">$0</span>
            </div>
            <div id="perdido" ondrop="drop(event, 'perdido')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" class="kanban-column space-y-4"></div>
        </div>
    </div>

    <div id="modal-deal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md shadow-2xl animate__animated animate__zoomIn animate__faster overflow-hidden">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <h3 id="modal-title" class="text-[10px] font-900 uppercase tracking-widest text-slate-400">Gestión de Negocio</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white border hover:text-red-500 transition-all"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-8 space-y-5">
                <div class="p-5 bg-blue-600 rounded-3xl text-center shadow-lg shadow-blue-100">
                    <label class="block text-[10px] font-900 text-blue-100 uppercase mb-3">Escáner de Cotización (PDF)</label>
                    <input type="file" id="pdf-in" accept=".pdf" onchange="processPDF(this)" class="block w-full text-[10px] text-blue-100 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-bold file:bg-white file:text-blue-600 cursor-pointer"/>
                    <p id="pdf-status" class="text-[10px] text-blue-200 mt-3 font-bold"></p>
                </div>
                <input type="hidden" id="f-id"><input type="hidden" id="f-st">
                <div class="space-y-1">
                    <label class="text-[10px] font-800 text-slate-400 uppercase ml-1">Cliente / Proyecto</label>
                    <input type="text" id="f-cli" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl font-bold focus:border-blue-500 outline-none uppercase text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-800 text-slate-400 uppercase ml-1">Monto del Proyecto</label>
                    <div class="relative">
                        <span class="absolute left-4 top-4 font-bold text-slate-400">$</span>
                        <input type="number" id="f-mon" class="w-full bg-slate-50 border-2 border-slate-100 p-4 pl-8 rounded-2xl font-black text-2xl text-slate-900 focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="pt-4 flex gap-3">
                    <button onclick="saveDeal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold uppercase text-xs shadow-lg shadow-blue-200 transition-all active:scale-95">Guardar Negocio</button>
                    <button id="btn-delete" onclick="deleteDeal()" class="bg-red-50 text-red-500 px-5 rounded-2xl hover:bg-red-500 hover:text-white transition-all"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://impetec-hub-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let me = localStorage.getItem('imp_user') || 'Admin';
        let currentYear = 2026;
        let currentDeals = [];

        const ms = document.getElementById('m-sel');
        ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach((m, i) => {
            const o = document.createElement('option'); o.value = i; o.innerText = m;
            if(i === new Date().getMonth()) o.selected = true;
            ms.appendChild(o);
        });
        document.getElementById('year-display').innerText = currentYear;

        function loadDeals() {
            db.ref(`deals/${ms.value}-${currentYear}`).on('value', snap => {
                currentDeals = snap.val() ? Object.values(snap.val()) : [];
                renderBoard();
            });
        }

        function renderBoard() {
            const searchTerm = document.getElementById('deal-search').value.toUpperCase();
            const cols = ['prospecto', 'cotizado', 'obra', 'ganado', 'perdido'];
            cols.forEach(id => document.getElementById(id).innerHTML = '');
            let totals = { prospecto: 0, cotizado: 0, obra: 0, ganado: 0, perdido: 0 };
            let countP = 0;

            currentDeals.forEach((deal, idx) => {
                // FILTRO DE BÚSQUEDA
                if(searchTerm && !deal.cliente.toUpperCase().includes(searchTerm)) return;
                
                if(!cols.includes(deal.status)) return;
                const card = document.createElement('div');
                card.className = 'deal-card p-5 rounded-[1.5rem] shadow-sm mb-4';
                card.draggable = true;
                card.onclick = () => openEditModal(deal.id);
                card.ondragstart = (e) => { e.dataTransfer.setData("text", deal.id); card.classList.add('opacity-40'); };
                card.ondragend = () => card.classList.remove('opacity-40');

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[9px] font-black bg-slate-100 px-2 py-1 rounded text-slate-400 uppercase tracking-tighter">Ref: ${deal.id.slice(-4)}</span>
                        <div class="flex gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span><span class="w-1.5 h-1.5 rounded-full bg-slate-100"></span></div>
                    </div>
                    <h4 class="font-bold text-slate-800 text-xs mb-1 uppercase truncate">${deal.cliente}</h4>
                    <p class="text-lg font-900 text-slate-900 tracking-tighter">$${(deal.monto || 0).toLocaleString()}</p>
                    <div class="mt-4 pt-3 border-t border-slate-50 flex justify-between items-center text-[9px] font-bold text-slate-300">
                        <span class="italic font-normal">Por: ${deal.by || 'S/N'}</span>
                        <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </div>
                `;
                
                document.getElementById(deal.status).appendChild(card);
                totals[deal.status] += parseFloat(deal.monto || 0);
                if(deal.status === 'prospecto') countP++;
            });

            document.getElementById('count-prospecto').innerText = countP;
            ['cotizado', 'obra', 'ganado', 'perdido'].forEach(k => {
                document.getElementById(`val-${k}`).innerText = `$${totals[k].toLocaleString()}`;
            });
            lucide.createIcons();
        }

        async function processPDF(input) {
            const file = input.files[0];
            if (!file) return;
            const status = document.getElementById('pdf-status');
            status.innerHTML = "⚡ ANALIZANDO DATOS...";
            document.getElementById('f-cli').value = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ").toUpperCase();
            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        fullText += content.items.map(item => item.str).join(" ") + " ";
                    }
                    const cleanText = fullText.replace(/\s+/g, ' ').toUpperCase();
                    const moneyRegex = /(\d{1,3}(?:,\d{3})*(?:\.\d{2}))|(\d+(?:\.\d{2}))/g;
                    const keywords = ["TOTAL", "NETO", "IMPORTE", "SUMA", "VALOR", "TOTAL A PAGAR"];
                    let finalAmount = 0;
                    let foundByKeyword = false;
                    for (let word of keywords) {
                        const lastIdx = cleanText.lastIndexOf(word);
                        if (lastIdx !== -1) {
                            const snippet = cleanText.substring(lastIdx, lastIdx + 60);
                            const matches = snippet.match(moneyRegex);
                            if (matches) {
                                finalAmount = parseFloat(matches[matches.length - 1].replace(/,/g, ''));
                                foundByKeyword = true;
                                break;
                            }
                        }
                    }
                    if (!foundByKeyword) {
                        const allMatches = cleanText.match(moneyRegex);
                        if (allMatches) {
                            const nums = allMatches.map(m => parseFloat(m.replace(/,/g, '')));
                            finalAmount = Math.max(...nums);
                        }
                    }
                    if (finalAmount > 0) {
                        document.getElementById('f-mon').value = finalAmount;
                        status.innerHTML = "✅ DETECTADO: $" + finalAmount.toLocaleString();
                    } else {
                        status.innerHTML = "⚠ NOMBRE OK. MONTO NO DETECTADO.";
                    }
                } catch (e) { status.innerHTML = "❌ ERROR AL LEER PDF"; }
            };
            reader.readAsArrayBuffer(file);
        }

        function allowDrop(e) { e.preventDefault(); }
        function dragEnter(e) { e.currentTarget.classList.add('drag-over'); }
        function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        function drop(e, newStatus) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = e.dataTransfer.getData("text");
            if(id) db.ref(`deals/${ms.value}-${currentYear}/${id}`).update({ status: newStatus });
        }

        function openEditModal(id = null) {
            const deal = id ? currentDeals.find(d => d.id === id) : null;
            document.getElementById('f-id').value = id || '';
            document.getElementById('f-st').value = deal ? deal.status : 'prospecto';
            document.getElementById('f-cli').value = deal ? deal.cliente : '';
            document.getElementById('f-mon').value = deal ? deal.monto : '';
            document.getElementById('pdf-in').value = "";
            document.getElementById('pdf-status').innerText = "";
            document.getElementById('btn-delete').classList.toggle('hidden', !id);
            document.getElementById('modal-title').innerText = id ? 'ACTUALIZAR DATOS' : 'NUEVO PROYECTO';
            document.getElementById('modal-deal').classList.remove('hidden');
        }

        function closeModal() {
            const m = document.getElementById('modal-deal');
            m.firstElementChild.classList.replace('animate__zoomIn', 'animate__zoomOut');
            setTimeout(() => {
                m.classList.add('hidden');
                m.firstElementChild.classList.replace('animate__zoomOut', 'animate__zoomIn');
            }, 200);
        }

        function saveDeal() {
            const cli = document.getElementById('f-cli').value;
            if(!cli) return alert('Ingresa el nombre del cliente');
            const id = document.getElementById('f-id').value || 'ID-' + Date.now();
            const data = { id, cliente: cli.toUpperCase(), monto: parseFloat(document.getElementById('f-mon').value) || 0, status: document.getElementById('f-st').value || 'prospecto', by: me };
            db.ref(`deals/${ms.value}-${currentYear}/${id}`).set(data).then(() => closeModal());
        }

        function deleteDeal() {
            const id = document.getElementById('f-id').value;
            if(id && confirm('¿Eliminar definitivamente?')) {
                db.ref(`deals/${ms.value}-${currentYear}/${id}`).remove().then(() => closeModal());
            }
        }

        window.onload = loadDeals;
    </script>
</body>
</html>
