<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IMPETEC HUB - Subida de ODC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f3f4f6; }
        .btn-gradient { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); transition: all 0.3s ease; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter italic">IMPETEC <span class="text-red-600">PAGOS</span></h1>
                <p id="user-display" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1"></p>
            </div>
            <button onclick="document.getElementById('m-add').classList.remove('hidden')" class="btn-gradient text-white px-8 py-4 rounded-2xl font-bold text-sm uppercase shadow-lg">
                <i class="fas fa-plus-circle mr-2"></i> Nueva ODC
            </button>
        </header>

        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-slate-100">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr>
                        <th class="p-6 text-[11px] font-black text-slate-400 uppercase">Proveedor</th>
                        <th class="p-6 text-[11px] font-black text-slate-400 uppercase text-center">Monto</th>
                        <th class="p-6 text-[11px] font-black text-slate-400 uppercase text-center">Estado</th>
                        <th class="p-6 text-[11px] font-black text-slate-400 uppercase text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista" class="divide-y divide-slate-50"></tbody>
            </table>
        </div>
    </div>

    <div id="m-add" class="fixed inset-0 bg-slate-900/40 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[3rem] w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-black text-slate-800 mb-8 text-center uppercase italic">Cargar Orden</h3>
            <div class="space-y-5">
                <div class="relative p-8 bg-red-50 border-2 border-dashed border-red-200 rounded-[2rem] text-center">
                    <input type="file" id="f-pdf" accept=".pdf" onchange="readPDF(this)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <i class="fas fa-file-pdf text-3xl text-red-500 mb-3"></i>
                    <p id="pdf-status" class="text-[11px] font-black text-red-600 uppercase">Seleccionar PDF</p>
                </div>
                <input type="text" id="n-orden" placeholder="NOMBRE PROVEEDOR" class="w-full p-5 rounded-2xl bg-slate-50 border-none font-bold uppercase text-sm shadow-inner outline-none">
                <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 font-black text-slate-400">$</span>
                    <input type="number" id="n-monto" readonly class="w-full p-5 pl-10 rounded-2xl bg-slate-100 font-black text-2xl text-slate-900 cursor-not-allowed outline-none">
                </div>
            </div>
            <div class="flex gap-4 mt-10">
                <button onclick="document.getElementById('m-add').classList.add('hidden')" class="flex-1 text-slate-400 font-bold text-xs uppercase">Cancelar</button>
                <button onclick="subir()" class="flex-1 btn-gradient text-white py-5 rounded-2xl font-bold text-xs uppercase shadow-lg">Agendar Urgente</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://impetec-hub-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let me = localStorage.getItem('imp_user') || 'Admin';
        document.getElementById('user-display').innerText = `Responsable: ${me}`;

        async function readPDF(input) {
            const file = input.files[0];
            if (!file) return;
            document.getElementById('n-orden').value = file.name.replace(".pdf", "").toUpperCase();
            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let full = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    full += content.items.map(item => item.str).join(" ") + " ";
                }
                const matches = full.match(/(\d{1,3}(?:,\d{3})*(?:\.\d{2})|\d+(?:\.\d{2}))/g);
                if (matches) {
                    const total = Math.max(...matches.map(m => parseFloat(m.replace(/,/g, ''))));
                    document.getElementById('n-monto').value = total;
                    document.getElementById('pdf-status').innerHTML = "✅ TOTAL: $" + total.toLocaleString();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- FUNCIÓN QUE SINCRONIZA CON EL COLOR ROJO DE TU AGENDA ---
        function syncAgenda() {
            const now = new Date();
            const path = `agenda/${now.getMonth()}-${now.getFullYear()}/d${now.getDate()}`;

            db.ref('control_pagos').once('value', snap => {
                const data = snap.val();
                if (!data) return;

                const updates = {};
                Object.keys(data).forEach(id => {
                    const d = data[id];
                    if (d.status === 'PENDIENTE') {
                        // AQUÍ ESTÁ EL AJUSTE PARA TU AGENDA:
                        updates[`${path}/${id}`] = {
                            txt: `PAGO ODC: ${d.nombre} ($${d.monto.toLocaleString()})`,
                            time: "08:00",
                            prio: "prio-alta", // Usa 'prio-alta' para activar el CSS de tu agenda
                            status: "pendiente", //
                            u: d.lastUser || me //
                        };
                    }
                });
                db.ref().update(updates);
            });
        }

        function subir() {
            const n = document.getElementById('n-orden').value, m = document.getElementById('n-monto').value, f = document.getElementById('f-pdf').files[0];
            if (!n || !m) return alert("Falta información");

            const reader = new FileReader();
            reader.readAsDataURL(f);
            reader.onload = function() {
                const id = db.ref('control_pagos').push().key;
                const record = {
                    id, nombre: n.toUpperCase(), monto: parseFloat(m), pdf: reader.result,
                    status: 'PENDIENTE', fecha: new Date().toLocaleDateString('es-MX'), lastUser: me
                };

                db.ref('control_pagos/' + id).set(record).then(() => {
                    syncAgenda();
                    document.getElementById('m-add').classList.add('hidden');
                    alert("¡Sincronizado con la Agenda en Rojo!");
                });
            };
        }

        db.ref('control_pagos').on('value', snap => {
            const list = document.getElementById('lista');
            list.innerHTML = '';
            const data = snap.val();
            if (data) {
                Object.keys(data).reverse().forEach(id => {
                    const d = data[id];
                    const color = d.status === 'PAGADO' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600';
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-6">
                                <div class="font-bold text-slate-800 text-sm uppercase">${d.nombre}</div>
                                <div class="text-[10px] text-slate-400 font-bold">${d.fecha}</div>
                            </td>
                            <td class="p-6 text-center font-black text-slate-900">$${d.monto.toLocaleString()}</td>
                            <td class="p-6 text-center">
                                <button onclick="toggleStatus('${id}', '${d.status}')" class="px-5 py-2 rounded-xl text-[10px] font-black uppercase ${color}">${d.status}</button>
                            </td>
                            <td class="p-6 text-right flex justify-end gap-3">
                                <a href="${d.pdf}" download="${d.nombre}.pdf" class="text-red-500"><i class="fas fa-file-pdf text-lg"></i></a>
                                <button onclick="borrar('${id}')" class="text-slate-200 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>`;
                });
            }
        });

        function toggleStatus(id, st) {
            const next = st === 'PENDIENTE' ? 'PAGADO' : 'PENDIENTE';
            const now = new Date();
            db.ref('control_pagos/' + id).update({ status: next }).then(() => {
                if (next === 'PAGADO') {
                    db.ref(`agenda/${now.getMonth()}-${now.getFullYear()}/d${now.getDate()}/${id}`).remove();
                } else {
                    syncAgenda();
                }
            });
        }

        function borrar(id) {
            if (confirm("¿Borrar permanentemente?")) {
                const now = new Date();
                db.ref('control_pagos/' + id).remove();
                db.ref(`agenda/${now.getMonth()}-${now.getFullYear()}/d${now.getDate()}/${id}`).remove();
            }
        }

        window.onload = () => { syncAgenda(); };
    </script>
</body>
</html>
